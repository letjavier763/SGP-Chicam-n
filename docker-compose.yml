services:

  # PHP-FPM 8.1 — Aplicación Laravel

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sgp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sgp_network
    depends_on:
      - db

 
  # Nginx — Servidor Web

  nginx:
    image: nginx:alpine
    container_name: sgp_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sgp_network
    depends_on:
      - app


  # PostgreSQL 15 — Base de Datos
  
  db:
    image: postgres:15-alpine
    container_name: sgp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - sgp_pgdata:/var/lib/postgresql/data
    networks:
      - sgp_network

 
  # pgAdmin 4 
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - sgp_pgadmin_data:/var/lib/pgadmin
    networks:
      - sgp_network
    depends_on:
      - db


# Volúmenes persistentes

volumes:
  sgp_pgdata:
    driver: local
  sgp_pgadmin_data:
    driver: local


# Red interna

networks:
  sgp_network:
    driver: bridge
